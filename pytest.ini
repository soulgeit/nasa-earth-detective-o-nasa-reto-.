[pytest]
# `scripts/` contiene utilidades que se ejecutan a mano (capturas, demo,
# comprobaciones con Playwright). `scripts/test_ui_r5.py` se llama asi pero es
# un script: importa `playwright`, que no esta en requirements-dev.txt y no
# debe estarlo (son ~50 MB para un navegador que solo usa el que hace capturas).
# Sin esta linea, un clon limpio falla en el primer `pytest -q` y `gate.py`
# cierra la puerta.
testpaths = tests
markers =
    live: marks tests that connect to live upstream services
