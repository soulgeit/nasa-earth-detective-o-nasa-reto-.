<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0c1d36"/>
      <stop offset="60%" stop-color="#060b17"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- Sun / Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="sunRayGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Cyan / Cyber Earth Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Orbit Glow -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#spaceGlow)"/>

  <!-- Subtle Constellation / Grid Network Backdrop -->
  <g opacity="0.22" stroke="#38BDF8" stroke-width="0.8">
    <circle cx="400" cy="180" r="140" fill="none" stroke-dasharray="3,6"/>
    <circle cx="400" cy="180" r="175" fill="none" stroke-dasharray="2,8"/>
    <!-- Diagonal Lat/Long Curves -->
    <path d="M 230,180 A 170,170 0 0,0 570,180" fill="none"/>
    <path d="M 260,130 A 160,80 0 0,0 540,130" fill="none"/>
    <path d="M 260,230 A 160,80 0 0,1 540,230" fill="none"/>
  </g>

  <!-- Satellite Orbit Ring 1 -->
  <ellipse cx="400" cy="180" rx="160" ry="65" fill="none" stroke="url(#orbitGrad)" stroke-width="2.2" transform="rotate(-22 400 180)" filter="url(#glowCyan)"/>
  <!-- Satellite Orbit Ring 2 -->
  <ellipse cx="400" cy="180" rx="160" ry="55" fill="none" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-dasharray="6,6" transform="rotate(35 400 180)"/>

  <!-- Satellite Data Nodes (AI / NASA missions) -->
  <circle cx="265" cy="130" r="4.5" fill="#38BDF8" filter="url(#glowCyan)"/>
  <circle cx="530" cy="145" r="4" fill="#FBBF24" filter="url(#glowGold)"/>
  <circle cx="340" cy="235" r="3.5" fill="#67E8F9"/>

  <!-- HUIRACOCHA CENTRAL ICON: The Solar Crown & Chakana Mask -->
  <g transform="translate(400, 180)">

    <!-- Stepped Halo / Chakana Solar Corona -->
    <!-- Top Central Ray (Trident / Crown Crown) -->
    <path d="M 0,-70 L -12,-95 L 0,-115 L 12,-95 Z" fill="url(#goldGrad)" filter="url(#glowGold)"/>
    <circle cx="0" cy="-118" r="3" fill="#FFF"/>

    <!-- Left Upper Ray -->
    <path d="M -35,-55 L -60,-75 L -65,-95 L -45,-85 Z" fill="url(#goldGrad)"/>
    <circle cx="-66" cy="-97" r="2.5" fill="#FDE68A"/>

    <!-- Right Upper Ray -->
    <path d="M 35,-55 L 60,-75 L 65,-95 L 45,-85 Z" fill="url(#goldGrad)"/>
    <circle cx="66" cy="-97" r="2.5" fill="#FDE68A"/>

    <!-- Lateral Rays (Geometric Andean Stepped Motif) -->
    <path d="M -55,-25 L -85,-35 L -105,-25 L -85,-15 Z" fill="url(#goldGrad)"/>
    <circle cx="-108" cy="-25" r="2.5" fill="#FDE68A"/>

    <path d="M 55,-25 L 85,-35 L 105,-25 L 85,-15 Z" fill="url(#goldGrad)"/>
    <circle cx="108" cy="-25" r="2.5" fill="#FDE68A"/>

    <!-- Diagonals Lower -->
    <path d="M -50,15 L -75,25 L -85,45 L -65,40 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <path d="M 50,15 L 75,25 L 85,45 L 65,40 Z" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- Solar Face / Planetary Disc (Earth-Sun Fusion) -->
    <circle cx="0" cy="0" r="54" fill="#0B1528" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="48" fill="#0E223D" opacity="0.9"/>

    <!-- Andean Stepped Chakana Profile on Forehead -->
    <path d="M -16,-22 L -8,-22 L -8,-30 L 8,-30 L 8,-22 L 16,-22 L 16,-14 L -16,-14 Z" fill="url(#goldGrad)"/>

    <!-- AI Neural Eye Centers (Vision & Observation) -->
    <!-- Left Eye (Geometric Andean / Digital Hex-Angle) -->
    <polygon points="-24,-5 -10,-5 -14,6 -28,6" fill="url(#cyanGrad)" filter="url(#glowCyan)"/>
    <circle cx="-19" cy="0" r="2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <polygon points="10,-5 24,-5 28,6 14,6" fill="url(#cyanGrad)" filter="url(#glowCyan)"/>
    <circle cx="19" cy="0" r="2" fill="#FFFFFF"/>

    <!-- Huiracocha's Sacred Tears (Rainfall / Water Cycle / Data Streams) -->
    <!-- In Andean mythology Huiracocha wept tears of rain for the Earth; here represented as climate data streams -->
    <path d="M -21,12 L -21,34 L -16,42 L -16,58" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-16" cy="62" r="3" fill="#67E8F9" filter="url(#glowCyan)"/>
    <circle cx="-21" cy="22" r="1.5" fill="#FFFFFF"/>

    <path d="M 21,12 L 21,34 L 16,42 L 16,58" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="62" r="3" fill="#67E8F9" filter="url(#glowCyan)"/>
    <circle cx="21" cy="22" r="1.5" fill="#FFFFFF"/>

    <!-- Andean Nose & Mouth (Chiseled, Noble & Minimalist) -->
    <polygon points="0,-8 -5,12 5,12" fill="#F59E0B" opacity="0.9"/>
    <path d="M -10,22 L 10,22" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Data Stream / Trend Line Graph across bottom of mask -->
    <path d="M -38,18 L -30,12 L -18,24 L 0,8 L 18,24 L 30,12 L 38,18" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="2,2" opacity="0.75"/>
  </g>

  <!-- Typography Section -->
  <!-- Main Title -->
  <text x="400" y="380" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">
    HUIRACOCHA <tspan fill="url(#goldGrad)">IA</tspan>
  </text>

  <!-- Subtitle with NASA / Earth Science connection -->
  <text x="400" y="415" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="5">
    EARTH INTELLIGENCE &amp; CLIMATE TREND DETECTIVE
  </text>

  <!-- Badges / Mission Line -->
  <g transform="translate(400, 445)" opacity="0.75">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
      NASA EARTH SCIENCE • MODIS • GPM • MERRA-2 • GLDAS
    </text>
  </g>

</svg>